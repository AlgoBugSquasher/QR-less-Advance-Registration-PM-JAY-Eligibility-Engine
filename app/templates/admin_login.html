{% extends "base.html" %}

{% block title %}Admin Login - Hospital Token System{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; color: var(--primary-color);">
                <i class="fas fa-user-shield"></i>
            </div>
            <h1 style="margin-top: 1rem;">Admin Login</h1>
            <p class="text-muted">Sign in to manage department queues.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.admin_login') }}" id="adminLoginForm">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div style="margin-top: 1rem; text-align: center;">
            <p class="text-muted" style="font-size: 0.9rem;">For demo purposes, use <strong>admin</strong> / <strong>admin123</strong>.</p>
        </div>
    </div>
</div>
{% endblock %}
