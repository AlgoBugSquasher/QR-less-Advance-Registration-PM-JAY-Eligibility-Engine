<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Token System - Portal Selection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0066cc;
            --primary-dark: #004ba6;
            --accent-color: #00d4ff;
            --success-color: #28a745;
            --light-gray: #f8f9fa;
            --text-dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .portal-container {
            max-width: 1000px;
            width: 100%;
        }

        .portal-header {
            text-align: center;
            color: white;
            margin-bottom: 4rem;
        }

        .portal-header h1 {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .portal-header p {
            font-size: 1.3rem;
            opacity: 0.95;
        }

        .portal-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
            margin-bottom: 2rem;
        }

        .portal-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .portal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
        }

        .portal-card .card-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
        }

        .portal-card h2 {
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .portal-card .card-subtitle {
            color: #999;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .portal-card .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-size: 1.05rem;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-user:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .btn-admin {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
        }

        .btn-admin:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.4);
        }

        .portal-footer {
            text-align: center;
            color: white;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .portal-footer p {
            margin: 0.5rem 0;
        }

        @media (max-width: 768px) {
            .portal-header h1 {
                font-size: 2.5rem;
            }

            .portal-header p {
                font-size: 1rem;
            }

            .portal-card {
                padding: 2rem 1.5rem;
            }

            .portal-card .card-icon {
                font-size: 3.5rem;
            }

            .portal-card h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="portal-header">
            <h1>🏥 Hospital Token System</h1>
            <p>Quick and Easy Token Management</p>
        </div>

        <div class="portal-cards">
            <!-- User Portal Card -->
            <a href="{{ url_for('auth.login') }}" class="portal-card">
                <div class="card-icon">👤</div>
                <h2>User Portal</h2>
                <p class="card-subtitle">For Patients</p>
                <button class="btn btn-user">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </a>

            <!-- Admin Portal Card -->
            <a href="{{ url_for('auth.admin_login') }}" class="portal-card">
                <div class="card-icon">🛠</div>
                <h2>Admin Portal</h2>
                <p class="card-subtitle">For Hospital Staff</p>
                <button class="btn btn-admin">
                    <i class="fas fa-user-shield"></i> Sign In
                </button>
            </a>
        </div>

        <div class="portal-footer">
            <p>🔒 Secure Hospital Token Management System</p>
            <p>© 2024 City Hospital & Diagnostic Center</p>
        </div>
    </div>
</body>
</html>
